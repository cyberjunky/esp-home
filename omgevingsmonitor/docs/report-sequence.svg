<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Omgevingsmonitor report sequence</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .hd{font-weight:600;font-size:14}
      .life{stroke:#999;stroke-width:1.2;stroke-dasharray:4 4}
      .m{stroke:#333;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lb{fill:#222;font-size:12}
      .n{fill:#555;font-size:11.5}
    </style>
  </defs>
  <rect width="860" height="470" fill="#fff"/>
  <rect x="40" y="20" width="160" height="34" rx="6" fill="#e8f1fb" stroke="#2b6cb0"/>
  <text class="hd" x="78" y="42">STM32L072</text>
  <rect x="350" y="20" width="160" height="34" rx="6" fill="#eaf7ee" stroke="#2f855a"/>
  <text class="hd" x="377" y="42">ESP32-C3</text>
  <rect x="660" y="20" width="160" height="34" rx="6" fill="#e6f6fb" stroke="#0b7a99"/>
  <text class="hd" x="682" y="42">Home Assistant</text>
  <line class="life" x1="120" y1="54" x2="120" y2="450"/>
  <line class="life" x1="430" y1="54" x2="430" y2="450"/>
  <line class="life" x1="740" y1="54" x2="740" y2="450"/>

  <text class="n" x="128" y="82">measure: battery (rest), dB(A) 2.4 s, optional sensors</text>
  <path class="m" d="M120,104 H428"/><text class="lb" x="160" y="98">power on (PC11), EN high</text>
  <text class="n" x="440" y="128">boot ~0.3 s, Wi-Fi join (fast_connect, static IP)</text>
  <path class="m" d="M430,150 H122"/><text class="lb" x="250" y="144">$H*crc (every 250 ms)</text>
  <path class="m" d="M120,182 H428"/><text class="lb" x="150" y="176">$D,fw=100,vb=4012,t=2153,h=4512,vi=102,la=452,...*crc</text>
  <path class="m" d="M430,214 H738"/><text class="lb" x="470" y="208">mDNS announce</text>
  <path class="m" d="M740,242 H432"/><text class="lb" x="480" y="236">API connect + subscribe</text>
  <path class="m" d="M430,270 H738"/><text class="lb" x="470" y="264">all sensor states</text>
  <path class="m" d="M740,298 H432"/><text class="lb" x="460" y="292">helper values (interval, maintenance)</text>
  <text class="n" x="440" y="320">settle 1.2 s</text>
  <path class="m" d="M430,342 H122"/><text class="lb" x="190" y="336">$C,ib=600,iu=60,mt=0*crc</text>
  <path class="m" d="M430,374 H122"/><text class="lb" x="250" y="368">$Z*crc  (done)</text>
  <text class="n" x="10" y="404">+150 ms, then ESP power off; settings saved to EEPROM if changed</text>
  <text class="n" x="10" y="436">Hard limit: power is cut after 25 s whatever happens (unless maintenance mode was requested).</text>
</svg>
