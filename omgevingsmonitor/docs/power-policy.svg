<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Omgevingsmonitor power policy</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .st{stroke-width:2;rx:12}
      .t{font-weight:600;font-size:15}
      .s{fill:#444;font-size:12}
      .l{stroke:#444;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .lb{fill:#333;font-size:11.5}
    </style>
  </defs>
  <rect width="900" height="420" fill="#fff"/>

  <rect class="st" x="30" y="40" width="240" height="120" fill="#eaf7ee" stroke="#2f855a"/>
  <text class="t" x="48" y="68">NORMAL</text>
  <text class="s" x="48" y="92">SoC &#8805; 60 % (or charging &#8805; 40 %)</text>
  <text class="s" x="48" y="112">report every base interval (10 min)</text>
  <text class="s" x="48" y="132">VOC/T/RH every 10 s</text>
  <text class="s" x="48" y="150">SEN5x PM hourly (SoC &#8805; 50 %)</text>

  <rect class="st" x="330" y="40" width="240" height="120" fill="#fff7e6" stroke="#c05621"/>
  <text class="t" x="348" y="68">SAVING</text>
  <text class="s" x="348" y="92">10 % &#8804; SoC &lt; 60 %</text>
  <text class="s" x="348" y="112">interval x2 (40-60 %), x4 (25-40 %),</text>
  <text class="s" x="348" y="130">x6 (10-25 %), max 3 h</text>
  <text class="s" x="348" y="150">VOC/T/RH still every 10 s</text>

  <rect class="st" x="630" y="40" width="240" height="120" fill="#fdecec" stroke="#c53030"/>
  <text class="t" x="648" y="68">SURVIVAL</text>
  <text class="s" x="648" y="92">SoC &lt; 10 % (~3.69 V)</text>
  <text class="s" x="648" y="112">no Wi-Fi, no sampling</text>
  <text class="s" x="648" y="132">one goodbye report, then only</text>
  <text class="s" x="648" y="150">a battery check per minute</text>

  <rect class="st" x="330" y="250" width="240" height="110" fill="#e8f1fb" stroke="#2b6cb0"/>
  <text class="t" x="348" y="278">USB</text>
  <text class="s" x="348" y="302">USB 5 V present</text>
  <text class="s" x="348" y="322">report every 60 s (configurable)</text>
  <text class="s" x="348" y="342">SEN5x + ENS160 run continuously</text>

  <path class="l" d="M272,85 H328"/>
  <path class="l" d="M328,115 H272"/>
  <text class="lb" x="282" y="78">drops</text>
  <text class="lb" x="278" y="132">recovers</text>
  <path class="l" d="M572,85 H628"/>
  <path class="l" d="M628,115 H572"/>
  <text class="lb" x="578" y="78">&lt; 10 %</text>
  <text class="lb" x="578" y="132">&#8805; 20 %</text>
  <path class="l" d="M450,162 V248"/>
  <text class="lb" x="458" y="210">plug / unplug from any state (EXTI wake)</text>

  <text class="s" x="30" y="395">Independent of state: when Wi-Fi or Home Assistant is unreachable, the interval backs off x2 after 2 and x4 after 3 failed reports.</text>
</svg>
