; De Omgevingsmonitor - lean STM32L072 firmware
; Build:  pio run            Flash (USB DFU, see README):  pio run -t upload
[platformio]
default_envs = omgevingsmonitor

[env:omgevingsmonitor]
platform = ststm32
board = omgevingsmonitor
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
extra_scripts = pre:scripts/st_usb_device.py
build_flags =
    -Os
    -Wall -Wextra -Wno-unused-parameter
    -Isrc
    -DUSE_HAL_DRIVER
    ; 0 = silent, 1 = errors, 2 = info, 3 = debug (UART1 PA9 @115200)
    -DLOG_LEVEL=2
upload_protocol = dfu
monitor_speed = 115200
