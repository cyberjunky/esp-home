# De Omgevingsmonitor - ESPHome firmware for the on-board ESP32-C3-WROOM-02U.
#
# The STM32L072 does all sensing and power management. It switches this ESP on
# only to report (a few seconds per interval), sends one data frame over UART0
# and switches it off again as soon as Home Assistant has the data.
#
# Flash (first time, over USB via the STM32 bridge - see README):
#   esphome run omgevingsmonitor.yaml --device COMx
# Later updates: put the device in maintenance mode (long-press the user button
# or switch on input_boolean.omgevingsmonitor_maintenance) and flash over Wi-Fi.

substitutions:
  name: omgevingsmonitor
  friendly_name: Omgevingsmonitor

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.10.0
  project:
    name: "wots.omgevingsmonitor"   # shown in HA as model "omgevingsmonitor" by "wots"
    version: "1.2.0"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # UART0 belongs to the STM32 link: no console / boot log chatter on it
      CONFIG_ESP_CONSOLE_NONE: y
      CONFIG_BOOTLOADER_LOG_LEVEL_NONE: y
      # faster cold boot - every millisecond awake costs battery
      CONFIG_BOOTLOADER_SKIP_VALIDATE_ON_POWER_ON: y

# Your own network settings (static IP etc.): every local/*.yaml is merged in.
packages: !include_dir_named local

external_components:
  - source:
      type: local
      path: components

logger:
  baud_rate: 0          # logs only via the API (`esphome logs`), never on UART0
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s    # being unreachable is normal; the STM32 decides

ota:
  - platform: esphome
    encryption: {}      # reuses the API encryption key (no separate OTA password)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true    # no scan: connect straight to the configured AP
  power_save_mode: none # we are on for seconds only, so be quick
  reboot_timeout: 0s
  # A static IP saves the DHCP round trip on every report (~0.5-2 s).
  # Recommended for battery life: put it in local/network.yaml (see local/README.md).

# Marks the device as "sleepy" for Home Assistant, so its entities keep their
# last values while the ESP is powered down. It never sleeps by itself: the
# STM32 removes power.
deep_sleep:
  id: sleep_ctrl

uart:
  id: stm32_uart
  tx_pin: GPIO21        # U0TXD -> STM32 LPUART1
  rx_pin: GPIO20        # U0RXD <- STM32 LPUART1
  baud_rate: 115200
  rx_buffer_size: 512

omgevingsmonitor:
  id: om
  uart_id: stm32_uart
  # Optional HA helpers (see homeassistant/omgevingsmonitor_helpers.yaml)
  interval_battery_source: ha_interval_battery
  interval_usb_source: ha_interval_usb
  maintenance_source: ha_maintenance

sensor:
  # --- values from the STM32 -------------------------------------------------
  - platform: omgevingsmonitor
    temperature: {name: "Temperature"}
    humidity: {name: "Humidity"}
    voc_index: {name: "VOC index"}
    voc_raw: {name: "VOC raw"}
    sound_level: {name: "Sound level"}
    sound_level_max: {name: "Sound level max"}
    sound_level_background: {name: "Sound level background (LA90)"}
    sound_level_l10: {name: "Sound level LA10"}
    dew_point: {name: "Dew point"}
    absolute_humidity: {name: "Absolute humidity"}
    battery_voltage: {name: "Battery voltage"}
    battery_level: {name: "Battery"}
    solar_voltage: {name: "Solar voltage"}
    solar_charging_time: {name: "Solar charging (24 h)"}
    energy_consumption: {name: "Energy consumption"}
    battery_runtime: {name: "Battery runtime without sun"}
    report_duration: {name: "Report duration"}
    # Optional add-on sensors: the STM32 detects them automatically; uncomment
    # the ones you have fitted ("Detected sensors" in HA shows what it found).
    # aht20_temperature: {name: "AHT20 temperature"}
    # aht20_humidity: {name: "AHT20 humidity"}
    # pressure: {name: "Pressure"}
    # bmp280_temperature: {name: "BMP280 temperature"}
    # bme280_humidity: {name: "BME280 humidity"}
    # aqi: {name: "Air quality index"}
    # tvoc: {name: "TVOC"}
    # eco2: {name: "eCO2"}
    # pm_1_0: {name: "PM1.0"}
    # pm_2_5: {name: "PM2.5"}
    # pm_4_0: {name: "PM4.0"}
    # pm_10_0: {name: "PM10"}
    # sen5x_temperature: {name: "SEN5x temperature"}
    # sen5x_humidity: {name: "SEN5x humidity"}
    # sen5x_voc_index: {name: "SEN5x VOC index"}
    # sen5x_nox_index: {name: "SEN5x NOx index"}
    # diagnostics
    report_interval: {name: "Report interval"}
    uptime: {name: "STM32 uptime"}
    i2c_errors: {name: "I2C errors"}
    link_failures: {name: "Report failures"}

  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 1s
    entity_category: diagnostic

  # --- settings coming from Home Assistant (minutes) -------------------------
  - platform: homeassistant
    id: ha_interval_battery
    entity_id: input_number.omgevingsmonitor_interval_battery
    internal: true
  - platform: homeassistant
    id: ha_interval_usb
    entity_id: input_number.omgevingsmonitor_interval_usb
    internal: true

binary_sensor:
  - platform: omgevingsmonitor
    usb_power: {name: "USB power"}
    charging: {name: "Charging"}
    maintenance_active: {name: "Maintenance (button)"}
    voc_baseline_restored: {name: "VOC baseline restored"}
  - platform: homeassistant
    id: ha_maintenance
    entity_id: input_boolean.omgevingsmonitor_maintenance
    internal: true

text_sensor:
  - platform: omgevingsmonitor
    power_mode: {name: "Power mode"}
    report_reason: {name: "Report reason"}
    charger_state: {name: "Charger"}
    reset_cause: {name: "STM32 reset cause"}
    stm32_firmware: {name: "STM32 firmware"}
    detected_sensors: {name: "Detected sensors"}
