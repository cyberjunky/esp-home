# Home Assistant package: helpers that let HA steer the Omgevingsmonitor.
#
# Install: copy to <config>/packages/ and add to configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Values are picked up the next time the device reports (it sleeps in between).

input_number:
  omgevingsmonitor_interval_battery:
    name: Omgevingsmonitor interval (battery)
    icon: mdi:timer-cog-outline
    min: 1
    max: 180
    step: 1
    initial: 10
    unit_of_measurement: min
    mode: box
  omgevingsmonitor_interval_usb:
    name: Omgevingsmonitor interval (USB)
    icon: mdi:timer-cog-outline
    min: 1
    max: 60
    step: 1
    initial: 1
    unit_of_measurement: min
    mode: box

input_boolean:
  omgevingsmonitor_maintenance:
    name: Omgevingsmonitor maintenance (keep Wi-Fi on for OTA)
    icon: mdi:wrench-clock

automation:
  - id: omgevingsmonitor_maintenance_auto_off
    alias: Omgevingsmonitor - maintenance off after 30 min
    description: Never leave the ESP awake by accident - it drains the battery.
    triggers:
      - trigger: state
        entity_id: input_boolean.omgevingsmonitor_maintenance
        to: "on"
        for: "00:30:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.omgevingsmonitor_maintenance

# --- Battery life with sun ----------------------------------------------------
# The device itself reports "Battery runtime without sun" (worst case). What the
# sun really adds shows in the 24 h trend of the battery level:
#   trend >= 0  -> the solar cell keeps up (shown as 365 days)
#   trend <  0  -> days until the battery reaches the 10 % survival threshold
sensor:
  - platform: derivative
    name: Omgevingsmonitor battery trend
    unique_id: omgevingsmonitor_battery_trend
    source: sensor.omgevingsmonitor_battery
    unit_time: d
    unit: "%/d"
    time_window: "24:00:00"
    round: 1

template:
  - sensor:
      - name: Omgevingsmonitor battery life at current trend
        unique_id: omgevingsmonitor_battery_life_trend
        unit_of_measurement: d
        icon: mdi:solar-power-variant-outline
        state_class: measurement
        availability: >
          {{ has_value('sensor.omgevingsmonitor_battery')
             and has_value('sensor.omgevingsmonitor_battery_trend')
             and is_state('binary_sensor.omgevingsmonitor_usb_power', 'off') }}
        state: >
          {% set soc = states('sensor.omgevingsmonitor_battery') | float %}
          {% set trend = states('sensor.omgevingsmonitor_battery_trend') | float %}
          {% if trend >= 0 %}365
          {% else %}{{ [((soc - 10) / -trend) | round(0), 365] | min }}
          {% endif %}
