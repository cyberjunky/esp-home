# =============================================================================
# Operame AQC Sensor - Custom ESPHome Component
# =============================================================================
#
# The AQC-0-0-0-0 sensor uses a different UART protocol than the MH-Z19.
# This custom sensor component reads CO2 values from the AQC sensor.
#
# Protocol difference:
# - MH-Z19 uses command: 0xFF 0x01 0x86 ... (response byte 1 = 0x86)
# - AQC uses command:    0xFF 0x01 0xC5 ... (response byte 1 = 0x86, different checksum)
#
# =============================================================================

substitutions:
  device_name: operame
  friendly_name: "CO2 Level"
  co2_warning: "700"
  co2_critical: "800"

esphome:
  name: ${device_name}

# Load external AQC sensor component
external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

# Enable Improv via Serial for web flasher Wi-Fi setup
improv_serial:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret esphome_ota

logger:

# UART for AQC sensor (same pins as MH-Z19)
uart:
  id: uart_aqc
  rx_pin: GPIO27
  tx_pin: GPIO26
  baud_rate: 9600

# =============================================================================
# AQC CO2 Sensor (External Component)
# =============================================================================
sensor:
  - platform: aqc_sensor
    uart_id: uart_aqc
    co2:
      name: "CO2"
      id: co2_value
      filters:
        - filter_out: nan
        - lambda: |-
            if (x < 400 || x > 5000) return {};
            return x;
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# =============================================================================
# Display (TTGO T-Display), buttons and diagnostics
# =============================================================================
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

color:
  - id: color_black
    red: 0%
    green: 0%
    blue: 0%
  - id: color_white
    red: 100%
    green: 100%
    blue: 100%
  - id: color_green
    red: 0%
    green: 100%
    blue: 0%
  - id: color_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: color_red
    red: 100%
    green: 0%
    blue: 0%
  - id: color_blue
    red: 0%
    green: 0%
    blue: 100%

font:
  - file: "gfonts://Roboto@700"
    id: font_ppm
    size: 72
  - file: "gfonts://Roboto"
    id: font_label
    size: 20

display:
  - platform: st7789v
    id: ttgo_display
    model: TTGO TDisplay 135x240
    backlight_pin: GPIO4
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    rotation: 90
    update_interval: 1s
    lambda: |-
      float co2 = id(co2_value).state;
      Color bg_color;
      Color text_color;
      
      if (isnan(co2) || co2 == 0) {
        bg_color = id(color_blue);
        text_color = id(color_white);
        it.fill(bg_color);
        it.printf(it.get_width()/2, it.get_height()/2, id(font_label), text_color, TextAlign::CENTER, "Warming up...");
        return;
      }
      
      if (co2 >= ${co2_critical}) {
        bg_color = id(color_red);
        text_color = id(color_white);
      } else if (co2 >= ${co2_warning}) {
        bg_color = id(color_yellow);
        text_color = id(color_black);
      } else {
        bg_color = id(color_black);
        text_color = id(color_green);
      }
      
      it.fill(bg_color);
      if (id(wifi_connected).state) {
        it.rectangle(0, 0, it.get_width(), it.get_height(), id(color_blue));
      }
      it.printf(it.get_width()/2, it.get_height()/2 - 10, id(font_ppm), text_color, TextAlign::CENTER, "%.0f", co2);
      it.printf(it.get_width()/2, it.get_height()/2 + 40, id(font_label), text_color, TextAlign::CENTER, "ppm");

binary_sensor:
  - platform: status
    name: "Status"
    id: wifi_connected

  - platform: gpio
    id: button_0
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Button 0"

  - platform: gpio
    id: button_1
    pin:
      number: GPIO35
      inverted: true
    name: "Button 1"

# Backlight is controlled by display component on GPIO4

button:
  - platform: restart
    name: "Restart"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
  - platform: version
    name: "ESPHome Version"
